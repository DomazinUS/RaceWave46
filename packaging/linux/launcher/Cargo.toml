[package]
name = "racewave46-launcher"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "First-run ROM setup for RaceWave46 on Linux"
publish = false

[[bin]]
name = "racewave46"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }

[profile.release]
lto = true
strip = true
